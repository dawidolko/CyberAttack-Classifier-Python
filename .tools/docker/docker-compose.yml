# =============================================================================
# cyberattack — one-command run.
#
#   docker compose -f .tools/docker/docker-compose.yml up --build
#
# The dashboard is then served on http://localhost:8501.
# =============================================================================

name: cyberattack

services:
  app:
    build:
      context: ../..
      dockerfile: .tools/docker/Dockerfile
    restart: unless-stopped
    ports:
      - '${APP_PORT:-8501}:8501'
    # The dataset is downloaded from Kaggle on first boot (it is gitignored, not
    # committed), so the container needs outbound network access the first time
    # it runs. Later boots reuse the copy on the mounted data volume.
    volumes:
      # Generated artefacts are bind-mounted back to the host so the charts and
      # metrics written inside the container survive it being removed.
      - ../../results:/app/results
      - ../../data:/app/data
